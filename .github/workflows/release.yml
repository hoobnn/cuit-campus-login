name: Release

# 推送 v* 标签：测试 → macOS 签名、公证、Sparkle 签名、发布 GitHub Release
# → 附上 Windows 程序 → 同步 Homebrew cask → 重新部署 Pages（更新 appcast）。
# 在分支上手动触发时只做签名公证构建（产物见 workflow run），不发布。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# 发版不取消：公证做到一半被中断，最难收拾。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    permissions:
      contents: write
    uses: hoobnn/ci-workflows/.github/workflows/macos-release.yml@v1
    with:
      app-path: macos/build/CUITNet.app
      build-command: cd macos && scripts/build-app.sh
      artifact-basename: CUITNet
      entitlements: macos/CUITNet.entitlements
      inner-binaries: |
        Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate
        Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app
        Contents/Frameworks/Sparkle.framework
      make-dmg: true
      dmg-volume-name: CUIT 校园网
      sparkle: true
    secrets: inherit

  windows:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: windows
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - name: 🔨 Publish
        run: |
          dotnet publish src/CUITNet.App -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true "-p:Version=$env:VERSION" -o publish
          # 精简版：依赖已安装的 .NET 9 桌面运行时
          dotnet publish src/CUITNet.App -c Release -r win-x64 --no-self-contained `
            -p:PublishSingleFile=true "-p:Version=$env:VERSION" -o publish-lite
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item publish/CUITNet.exe "out/CUITNet-$env:VERSION-Windows.exe"
          Copy-Item publish-lite/CUITNet.exe "out/CUITNet-$env:VERSION-Windows-lite.exe"
          Get-ChildItem out -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" |
              Set-Content -NoNewline "$($_.FullName).sha256"
          }
      - name: 🚀 Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" (Get-ChildItem out -File).FullName --clobber

  homebrew:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: hoobnn/ci-workflows/.github/workflows/homebrew-cask.yml@v1
    with:
      cask: cuitnet
      artifact-basename: CUITNet
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  # 用 GITHUB_TOKEN 发布的 Release 不会触发其他 workflow，这里直接调用 Pages 更新 appcast
  pages:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
