name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    env:
      # 签名与公证所需的 secrets，配置方法见 docs/macos-signing.md；缺省时退回 ad-hoc 签名
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: swift test

      - name: 导入签名证书到临时钥匙串
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: 准备公证凭据
        if: env.NOTARY_KEY_P8_BASE64 != ''
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: 发布构建（签名 + 公证 + DMG）
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/release.sh "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"

      - name: 开发构建
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          scripts/build-app.sh 0.0.0 "$GITHUB_RUN_NUMBER"
          scripts/make-dmg.sh build/CUITNet.app build/CUITNet-dev.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: CUITNet-macos
          path: macos/build/*.dmg

      - name: 清理钥匙串与密钥
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet test tests/CUITNet.Core.Tests
      - run: >
          dotnet publish src/CUITNet.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish
      # 精简版：依赖已安装的 .NET 9 桌面运行时，体积约 1MB
      - run: >
          dotnet publish src/CUITNet.App -c Release -r win-x64 --no-self-contained
          -p:PublishSingleFile=true -o publish-lite
      - run: Move-Item publish-lite/CUITNet.exe publish/CUITNet-lite.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CUITNet-windows
          path: windows/publish/CUITNet*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
