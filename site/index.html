<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUIT 校园网</title>
<meta name="description" content="成都信息工程大学校园网自动登录，macOS 与 Windows 原生应用">
<link rel="icon" href="icon.png">
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #f5f5f7; --card: #fff; --accent: #0a66d8; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #111; --card: #1c1c1e; --accent: #4c9bff; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 20px; text-align: center; }
  img { width: 112px; height: 112px; }
  h1 { font-size: 32px; margin: 16px 0 4px; }
  p { color: var(--muted); margin: 0 0 32px; }
  .downloads { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn { display: inline-block; padding: 10px 22px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  a.btn.secondary { background: var(--card); color: var(--fg); }
  code { background: var(--card); padding: 6px 10px; border-radius: 8px; display: inline-block; margin-top: 24px; }
  footer { margin-top: 48px; font-size: 13px; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>CUIT 校园网</h1>
  <p>连上校园网后自动完成认证，掉线自动重连</p>
  <div class="downloads">
    <a class="btn" href="https://github.com/hoobnn/cuit-campus-login/releases/latest">下载 macOS / Windows 版</a>
    <a class="btn secondary" href="https://github.com/hoobnn/cuit-campus-login">源代码</a>
  </div>
  <code>brew install --cask hoobnn/tap/cuitnet</code>
  <footer>MIT License · <a href="https://github.com/hoobnn/cuit-campus-login">hoobnn/cuit-campus-login</a></footer>
</main>
</body>
</html>
